name: Docker Build Check
on:
  push:
    branches: [ main ]
  pull_request:
     branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code                                                                           uses: actions/checkout@v3 

    - name: Build Docker Image
      run: docker build -t my-devops-app .

    - name: Run Docker Container
      run: docker run -d my-devops-app
